name: Enhancement_LLMamba_LOL_v1
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/train/high
    dataroot_lq: data/LOLv1/train/low
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    mini_batch_sizes: [8]   
    iters: [300000]
    gt_size: 128
    gt_sizes: [128]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/test/high
    dataroot_lq: data/LOLv1/test/low
    io_backend:
      type: disk

network_g:
  type: LLMamba
  in_channels: 3
  out_channels: 3
  n_feat: 40
  stage: 1
  num_blocks: [1,2,4,2]

#path:
#  pretrain_network_g: pretrained/LOLv1.pth
#  strict_load_g: true
#  resume_state: ~

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 150000
  warmup_iter: -1
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [46000, 104000]       
    restart_weights: [1,1]
    eta_mins: [0.0003,0.000001]   
  
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]

  pixel_opt:
  - type: MSELoss
    loss_weight: 1
    reduction: mean
  - type: ColorLoss
    loss_weight: 0.5
    reduction: mean
  - type: SSIMLoss
    loss_weight: 0.1
    reduction: mean
  - type: MSELoss1
    loss_weight: 1
    reduction: mean
  - type: L_clip_MSE
    loss_weight: 0.00001
    reduction: mean

val:
  window_size: 4
  val_freq: !!float 1e3
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 8


  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 500
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:
    project: low_light
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
